name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # BLZ-534: the hang watchdog is armed in each per-file test child, never in the
    # `node --test` orchestrator or the `c8` process above it — so a wedged RUNNER is bounded
    # by this and by nothing else. Without it the bound is GitHub's 360-minute default, on
    # the merge gate. This job takes about 4 minutes; 20 is five times that.
    timeout-minutes: 20

    # The driver conformance suite asserts ONE contract across four drivers. Without a
    # real server the Postgres quarter skips, so the suite's headline claim would only
    # ever be proven on a developer's laptop and a Postgres-only regression would merge
    # green. This service makes the fourth driver a first-class citizen of CI.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blaze_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      BLAZE_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/blaze_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests + coverage gate
        run: npm run test:coverage
